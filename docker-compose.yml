version: '3.8'

services:
  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # MongoDB for Chronon online serving
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db

  # DynamoDB Local for Chronon online serving (KV store)
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spark Master
  spark-master:
    image: apache/spark:3.5.3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - spark_events:/opt/spark/spark-events

  # Spark Worker
  spark-worker:
    image: apache/spark:3.5.3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - spark_events:/opt/spark/spark-events
    deploy:
      replicas: 2

  # Chronon runner - Jupyter with PySpark (Python 3.11)
  chronon:
    image: jupyter/pyspark-notebook:latest
    user: root
    command: bash -c "pip install --quiet click thrift==0.21.0 pyyaml gitpython requests rich && tail -f /dev/null"
    ports:
      - "4040:4040"
    environment:
      - SPARK_HOME=/usr/local/spark
      - PYTHONPATH=/srv/chronon-python/src
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_ENDPOINT=http://minio:9000
      - CHRONON_DRIVER_JAR=/srv/jars/chronon-spark.jar
    volumes:
      - ./python:/srv/chronon-python:ro
      - ./python/test/sample:/srv/chronon
      - ./out/spark/assembly.dest/out.jar:/srv/jars/chronon-spark.jar:ro
      - ./sample_data:/srv/sample_data:ro
    depends_on:
      - spark-master
      - minio
      - mongodb
      - dynamodb

volumes:
  minio_data:
  mongodb_data:
  spark_events:
